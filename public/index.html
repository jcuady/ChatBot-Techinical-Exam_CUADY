<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="EastWest Banking Corporation — DCBSD Customer Intake Assistant. Enterprise-grade conversational banking portal designed by Malcolm Joaquin L. Cuady.">
  <meta name="theme-color" content="#3b0764">
  <title>EastWest Bank — DCBSD Customer Intake Assistant</title>
  <link rel="icon" type="image/png" href="assets/eastwest-icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient EastWest Brand Mesh Glows -->
  <div class="bg-glow bg-glow--1" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--2" aria-hidden="true"></div>

  <div id="app" class="app-container">
    <!-- Header -->
    <header class="chat-header" role="banner">
      <div class="header-left">
        <div class="header-brand-wrap">
          <img src="assets/eastwest-logo.png" alt="EastWest Bank" class="header-bank-logo">
        </div>
        <div class="header-text">
          <div class="header-title-row">
            <h1>DCBSD Customer Assistant</h1>
            <span class="badge-exam">Secure Portal</span>
          </div>
          <p class="header-status" id="connection-status" role="status">
            <span class="status-dot status-dot--online" aria-hidden="true"></span>
            <span id="connection-status-text">Bank-Grade 256-Bit SSL • Session Active</span>
          </p>
        </div>
      </div>

      <!-- Header Action Buttons -->
      <div class="header-actions">
        <button type="button" id="open-form-btn" class="btn-header-action" title="Open Adaptive Card Intake Form" aria-label="Open intake form">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <span class="action-label">Intake Form</span>
        </button>
        <button type="button" id="reset-chat-btn" class="btn-header-action btn-header-action--reset" title="Start a fresh intake conversation" aria-label="Start new session">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span class="action-label">New Session</span>
        </button>
      </div>
    </header>

    <!-- Chat Messages Area -->
    <main class="chat-messages" id="chat-messages" role="log" aria-label="Chat conversation log" aria-live="polite">
      <!-- Messages are injected here by chat.js -->
    </main>

    <!-- Input Area -->
    <footer class="chat-input-area" role="contentinfo">
      <form id="chat-form" class="chat-form" autocomplete="off">
        <label for="chat-input" class="sr-only">Type your message</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="chat-input"
            class="chat-input"
            placeholder="Type your message here..."
            aria-label="Type your message"
            maxlength="1000"
            autofocus
          >
          <span class="char-count" id="char-count">0/1000</span>
        </div>
        <button type="submit" id="send-button" class="send-button" aria-label="Send message" title="Send message (Enter)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <script src="chat.js"></script>
</body>
</html>
